[package]
name = "airlynx-app"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "airlynx-app"
path = "src/main.rs"

[dependencies]
airlynx-core = { path = "../core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7.0.0"
gethostname = "1.1.0"
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
log = "0.4.34"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[package.metadata.android]
package = "dev.airlynx.app"
apk_name = "AirLynx"
resources = "res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 34

# Android TV: no touch screen, and the launcher is the leanback one. Both stay optional so phones still install it.
[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

# The portrait lock below would otherwise make aapt require this feature, which a TV does not have.
[[package.metadata.android.uses_feature]]
name = "android.hardware.screen.portrait"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_DATA_SYNC"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "AirLynx"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# MainActivity (app/java) is NativeActivity plus the share target. singleTask makes a share while the app
# runs arrive in onNewIntent instead of starting a second native activity.
name = "dev.airlynx.app.MainActivity"
launch_mode = "singleTask"
exported = true
# Keep the NativeActivity alive across every configuration change instead of restarting it. A restart
# makes Android destroy the activity while the native event loop is idle, and that teardown never
# finishes (the app hangs and gets an ANR). Changes missing here that really happen: mcc/mnc (the SIM
# registering, roaming), fontScale, locale. The list is every value Android defines.
config_changes = "mcc|mnc|locale|touchscreen|keyboard|keyboardHidden|navigation|orientation|screenLayout|uiMode|screenSize|smallestScreenSize|layoutDirection|fontScale|density|colorMode|fontWeightAdjustment"
orientation = "portrait" # MainActivity switches a television to landscape

# The launcher entry. Supplying any MAIN filter makes cargo-apk drop its default one, so the phone launcher is listed
# here too. The Android TV home screen lists only activities with LEANBACK_LAUNCHER (its banner is patched in by
# build-apk.sh).
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]

# "Share to AirLynx" from any app: one file, several files, or text.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "*/*" }]

[package.metadata.android.signing.release]
path = "../android-debug.keystore"
keystore_password = "android"
