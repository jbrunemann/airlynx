name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # The versions scripts/build-apk.sh was developed with. The script picks the newest NDK and build-tools it finds.
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Android SDK parts
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      # Builds both APKs. With the ANDROID_KEYSTORE_BASE64 secret set they are all signed with the same key, so a newer APK
      # updates an installed one. Without it (pull requests from forks have no secrets) the script makes a throwaway key.
      - name: Build the APKs
        run: scripts/build-apk.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - uses: actions/upload-artifact@v4
        with:
          name: airlynx-android
          path: |
            target/release/apk/AirLynx.apk
            target/release/apk/AirLynx-armv7.apk
